<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Favicon. The same Fuji as components/Logo.tsx with the cap notch and water
    line removed, because both turn to mush at 16px.

    It carries its own ivory tile rather than sitting transparent: a vermilion
    silhouette alone vanishes against a dark tab strip, and the tile is the
    paper colour the whole site is built on.
  -->
