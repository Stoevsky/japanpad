  <circle cx="22" cy="12" r="5.5" fill="#c8a35d" opacity="0.6"/>
  <path
    d="M3 25.2C7.8 24.6 11.2 18.2 14 13.1L16 9.2L18 13.1C20.8 18.2 24.2 24.6 29 25.2Z"
    fill="#a82632"/>
</svg>
